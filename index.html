<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="TaskFlow is a private, scrapbook-inspired planner for tasks, deadlines, and focused work.">
  <meta name="theme-color" content="#341425">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>TaskFlow — Creative Planner</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script defer src="planner.js"></script>
  <script defer src="strings.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a id="skip-link" class="skip-link" href="#main-content">Skip to content</a>
  <div class="shell">
    <aside class="sidebar" id="sidebar" aria-label="Planner navigation"></aside>
    <div class="workspace">
      <header class="toolbar" id="toolbar"></header>
      <main id="main-content" tabindex="-1"></main>
    </div>
  </div>
  <dialog id="dialog" class="paper dialog" aria-labelledby="dialog-title"></dialog>
  <input type="file" id="backup-file" accept=".json,application/json" hidden>
  <div id="toast" class="toast" role="status" aria-atomic="true"></div>
  <noscript>This planner needs JavaScript to run in your browser.</noscript>
</body>
</html>
